# Jadi Link API + short links behind Cloudflare.
# Install: /etc/nginx/sites-available/jadi-link.conf (symlink into sites-enabled).
# Replace every "link.example.com" with the real short-link/API host.
# Written for nginx 1.24 (Ubuntu 24.04); newer nginx only warns about "http2".

upstream jadi_link_api {
    # Node listens on loopback only; never expose port 3001.
    server 127.0.0.1:3001;
    keepalive 16;
}

# Do not log the visitor IP. $remote_addr is the Cloudflare edge, and the
# CF-Connecting-IP header is deliberately left out of this format.
log_format jadi_link '$time_iso8601 "$request_method $uri" $status '
                     '$body_bytes_sent $request_time';

# Reject hostnames we do not serve (direct-IP scans, stale DNS, etc.).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name link.example.com;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name link.example.com;

    # Cloudflare Origin Certificate (SSL/TLS mode: Full (strict)).
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jadi_link_ssl:10m;
    ssl_session_timeout 1d;

    # Authenticated Origin Pulls: only Cloudflare holds the client certificate.
    # The IP allowlist alone is not authentication (any Cloudflare customer
    # shares these ranges), so both checks are required.
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    server_tokens off;
    access_log /var/log/nginx/jadi-link.access.log jadi_link;
    error_log  /var/log/nginx/jadi-link.error.log warn;

    # Matches the Fastify body limit (64 KiB) and request timeout (10 s).
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        proxy_pass http://jadi_link_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite (not append) so a client cannot inject forwarding hops.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The API trusts these only because the peer is this loopback proxy and
        # the edge above is restricted to authenticated Cloudflare pulls.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        # Redirects and API responses are dynamic and sent with no-store.
        proxy_cache off;
    }
}
