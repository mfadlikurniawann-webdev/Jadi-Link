# Jadi Link API + short links, served directly by nginx (no CDN in front).
# Install: /etc/nginx/sites-available/jadi-link.conf (symlink into sites-enabled).
# Replace every "link.example.com" with the real short-link/API host.
# TLS: Let's Encrypt via certbot (webroot /var/www/html), see README fase 8.
# Written for nginx 1.24 (Ubuntu 24.04); newer nginx only warns about "http2".

upstream jadi_link_api {
    # Node listens on loopback only; never expose port 3001.
    server 127.0.0.1:3001;
    keepalive 16;
}

# Do not log the visitor IP ($remote_addr) or the query string.
log_format jadi_link '$time_iso8601 "$request_method $uri" $status '
                     '$body_bytes_sent $request_time';

# Reject hostnames we do not serve (direct-IP scans, stale DNS, etc.).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name link.example.com;

    server_tokens off;
    access_log /var/log/nginx/jadi-link.access.log jadi_link;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/html).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name link.example.com;

    # Issued and renewed by certbot; renewal reloads nginx via --deploy-hook.
    ssl_certificate     /etc/letsencrypt/live/link.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jadi_link_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/jadi-link.access.log jadi_link;
    error_log  /var/log/nginx/jadi-link.error.log warn;

    # Matches the Fastify body limit (64 KiB) and request timeout (10 s).
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        proxy_pass http://jadi_link_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite (not append) so a client cannot inject forwarding hops.
        # The API trusts this header only from loopback (TRUST_PROXY).
        proxy_set_header X-Forwarded-For $remote_addr;
        # No Cloudflare in front: drop client-supplied CF headers so the API
        # cannot be fooled into using a forged visitor IP or country.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        # Redirects and API responses are dynamic and sent with no-store.
        proxy_cache off;
    }
}
